<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOFI GAME TV</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    #escena {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: pixelated;
        user-select: none;
    }
</style>
</head>

<body>

<img id="escena" src="dia.jpg" alt="SOFI GAME">

<script>

function cambiarEscena() {

    const ahora = new Date();

    const horas = ahora.getHours();
    const minutos = ahora.getMinutes();

    const minutosDelDia = horas * 60 + minutos;

    let imagen;

    /*
        5:30 AM - 7:00 AM
        AMANECER
    */
    if (minutosDelDia >= 330 && minutosDelDia < 420) {
        imagen = "amanecer.jpg";
    }

    /*
        7:00 AM - 8:00 PM
        DÍA
    */
    else if (minutosDelDia >= 420 && minutosDelDia < 1200) {
        imagen = "dia.jpg";
    }

    /*
        8:00 PM - 12:30 AM
        NOCHE
    */
    else if (minutosDelDia >= 1200 || minutosDelDia < 30) {
        imagen = "noche.jpg";
    }

    /*
        12:30 AM - 5:30 AM
        MADRUGADA
    */
    else {
        imagen = "madrugada.jpg";
    }

    const escena = document.getElementById("escena");

    if (!escena.src.endsWith(imagen)) {
        escena.src = imagen;
    }
}


/* Revisar inmediatamente */
cambiarEscena();

/* Revisar la hora cada 10 segundos */
setInterval(cambiarEscena, 10000);

</script>

</body>
</html>
