<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI GAME</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

.pantalla{
    width:100%;
    height:100%;
}

/* PORTADA */

#portada{
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:22px;
}

.titulo{
    color:#ff4fa3;
    font-size:clamp(45px,8vw,100px);
    font-weight:900;
    letter-spacing:3px;
    text-shadow:4px 4px #000;
}

.subtitulo{
    color:white;
    font-size:clamp(18px,3vw,35px);
    font-weight:bold;
    text-shadow:3px 3px #000;
}

.boton{
    border:4px solid white;
    background:#111;
    color:white;
    padding:14px 35px;
    font-size:clamp(20px,3vw,32px);
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
}

.boton-muere{
    background:#450000;
}

/* CASA */

#casa{
    width:100%;
    height:100%;
    position:relative;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.boton-casa{
    position:absolute;
    bottom:25px;
    width:70px;
    height:70px;
    border-radius:50%;
    border:3px solid white;
    background:rgba(0,0,0,.75);
    color:white;
    font-size:35px;
    cursor:pointer;
    z-index:10;
}

#btnNiveles{
    left:25px;
}

#btnEncuestas{
    right:25px;
}

/* NIVELES */

#niveles{
    width:100%;
    height:100%;
    background:#090909;
    color:white;
    padding:25px;
    display:flex;
    flex-direction:column;
}

.titulo-seccion{
    text-align:center;
    font-size:clamp(30px,5vw,55px);
    margin-bottom:20px;
}

.grid-niveles{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);
    gap:12px;
}

.nivel{
    border:3px solid #555;
    background:#191919;
    color:white;
    font-size:clamp(13px,1.8vw,24px);
    font-weight:bold;
    padding:8px;
    cursor:pointer;
    border-radius:6px;
}

.volver{
    margin:18px auto 0;
    border:3px solid white;
    background:#111;
    color:white;
    padding:10px 35px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    border-radius:6px;
}

/* ENCUESTAS */

#encuestas{
    width:100%;
    height:100%;
    background:#090909;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.mensaje-encuesta{
    font-size:25px;
    margin:20px;
}

/* MUERE */

#muere{
    position:fixed;
    inset:0;
    background:#000;
    color:white;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.mensaje-muere{
    font-size:clamp(28px,6vw,75px);
    font-weight:900;
}

.oculto{
    display:none !important;
}
</style>
</head>

<body>

<div class="pantalla">

<!-- PORTADA -->

<section id="portada">

    <div class="titulo">SOFI GAME</div>

    <div class="subtitulo">
        ¿TE ATREVES A ENTRAR?
    </div>

    <button class="boton" id="btnJuega">
        JUEGA
    </button>

    <button class="boton boton-muere" id="btnMuere">
        MUERE
    </button>

</section>


<!-- CASA -->

<section id="casa" class="oculto">

    <button class="boton-casa" id="btnNiveles">
        ☠️
    </button>

    <button class="boton-casa" id="btnEncuestas">
        ❓
    </button>

</section>


<!-- NIVELES -->

<section id="niveles" class="oculto">

    <h1 class="titulo-seccion">
        NIVELES
    </h1>

    <div class="grid-niveles">

        <button class="nivel">1. Tras Tiendas 0</button>
        <button class="nivel">2. Caída a Vecindario</button>
        <button class="nivel">3. Escaleras Interminables</button>
        <button class="nivel">4. Hotel</button>

        <button class="nivel">5. Pasillos Susurrantes</button>
        <button class="nivel">6. Poolrooms</button>
        <button class="nivel">7. Backrooms Espejo</button>
        <button class="nivel">8. Paisaje</button>

        <button class="nivel">9. Hello Kitty</button>
        <button class="nivel">10. Hello Kitty Garden</button>
        <button class="nivel">11. Ojos 3.14</button>
        <button class="nivel">12. Simulación</button>

        <button class="nivel">13. Nivel Fun</button>
        <button class="nivel">14. Roba un Brainrot</button>
        <button class="nivel">15. Bosque</button>
        <button class="nivel">16. Pisos Flotantes</button>

    </div>

    <button class="volver" id="volverNiveles">
        VOLVER
    </button>

</section>


<!-- ENCUESTAS -->

<section id="encuestas" class="oculto">

    <h1 class="titulo-seccion">
        ENCUESTAS
    </h1>

    <div class="mensaje-encuesta">
        No hay encuestas disponibles.
    </div>

    <button class="volver" id="volverEncuestas">
        VOLVER
    </button>

</section>


<!-- MUERE -->

<section id="muere" class="oculto">

    <div class="mensaje-muere">
        TE VA A VIGILAR EMILIANO DURANTE 2 HORAS
    </div>

</section>

</div>


<script>

/* =========================================
   IMÁGENES
========================================= */

const IMAGEN_DIA =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000cd8881f5bc25446156aefaf4.jpg";

const IMAGEN_NOCHE =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000035c881f5b0866c6cc2b3f8b8.png";


/* =========================================
   PRUEBA DE HOY
=========================================

   NOCHE DE PRUEBA:
   7:30 PM

   Antes de 7:30 PM = DÍA
   Desde 7:30 PM = NOCHE
*/

function actualizarImagen(){

    const ahora = new Date();

    const minutos =
        ahora.getHours() * 60 +
        ahora.getMinutes();

    // 7:30 PM
    const horaPrueba = (19 * 60) + 30;

    let imagen;

    if(minutos >= horaPrueba){

        imagen = IMAGEN_NOCHE;

    }else{

        imagen = IMAGEN_DIA;

    }

    document.body.style.backgroundImage =
        `url("${imagen}")`;

    const casa =
        document.getElementById("casa");

    casa.style.backgroundImage =
        `url("${imagen}")`;
}


/* Revisar inmediatamente */
actualizarImagen();


/* Revisar cada segundo */

setInterval(function(){

    actualizarImagen();

},1000);


/* =========================================
   BOTONES
========================================= */

const portada =
document.getElementById("portada");

const casa =
document.getElementById("casa");

const niveles =
document.getElementById("niveles");

const encuestas =
document.getElementById("encuestas");

const muere =
document.getElementById("muere");


/* JUEGA */

document.getElementById("btnJuega")
.addEventListener("click",function(){

    portada.classList.add("oculto");

    niveles.classList.add("oculto");

    encuestas.classList.add("oculto");

    muere.classList.add("oculto");

    casa.classList.remove("oculto");

    actualizarImagen();

});


/* MUERE */

document.getElementById("btnMuere")
.addEventListener("click",function(){

    portada.classList.add("oculto");

    casa.classList.add("oculto");

    niveles.classList.add("oculto");

    encuestas.classList.add("oculto");

    muere.classList.remove("oculto");

});


/* NIVELES */

document.getElementById("btnNiveles")
.addEventListener("click",function(){

    casa.classList.add("oculto");

    niveles.classList.remove("oculto");

});


/* ENCUESTAS */

document.getElementById("btnEncuestas")
.addEventListener("click",function(){

    casa.classList.add("oculto");

    encuestas.classList.remove("oculto");

});


/* VOLVER DE NIVELES */

document.getElementById("volverNiveles")
.addEventListener("click",function(){

    niveles.classList.add("oculto");

    casa.classList.remove("oculto");

    actualizarImagen();

});


/* VOLVER DE ENCUESTAS */

document.getElementById("volverEncuestas")
.addEventListener("click",function(){

    encuestas.classList.add("oculto");

    casa.classList.remove("oculto");

    actualizarImagen();

});


/* CERRAR MUERE */

muere.addEventListener("click",function(){

    muere.classList.add("oculto");

    portada.classList.remove("oculto");

});

</script>

</body>
</html>
