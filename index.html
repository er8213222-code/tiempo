<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI GAME</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:"Courier New",monospace;
}

#fondo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

button{
    font-family:"Courier New",monospace;
    cursor:pointer;
}


/* =========================
   PORTADA
========================= */

#portada{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}

#titulo{
    margin:0;

    color:#ff4fa3;

    font-size:clamp(50px,8vw,100px);
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        4px 4px 0 #6d1743,
        0 0 12px rgba(255,79,163,.35);
}

#subtitulo{
    margin-top:8px;

    color:white;

    font-size:clamp(14px,2vw,25px);
    letter-spacing:3px;

    text-shadow:3px 3px 0 #000;
}

#botonesPrincipales{
    display:flex;
    gap:20px;
    margin-top:35px;
}

.botonPrincipal{
    min-width:160px;
    padding:14px 25px;

    background:rgba(0,0,0,.82);

    border:3px solid white;
    border-radius:4px;

    color:white;

    font-size:20px;
    font-weight:bold;

    box-shadow:4px 4px 0 #000;
}

.botonPrincipal:hover,
.botonPrincipal:focus{
    outline:none;
    background:#ff4fa3;
}


/* =========================
   CASA
========================= */

#casa{
    position:fixed;
    inset:0;
    z-index:5;

    display:none;
}


/* =========================
   BOTONES DE ESQUINA
========================= */

.botonEsquina{
    position:fixed;

    bottom:22px;

    width:62px;
    height:62px;

    z-index:20;

    background:rgba(0,0,0,.85);

    border:3px solid white;
    border-radius:4px;

    color:white;

    font-size:30px;
    font-weight:bold;

    box-shadow:4px 4px 0 #000;

    display:none;
}

.botonEsquina:hover,
.botonEsquina:focus{
    outline:none;
    background:#ff4fa3;
}

#calavera{
    left:22px;
}

#pregunta{
    right:22px;
}


/* =========================
   NIVELES
========================= */

#niveles{
    position:fixed;
    inset:0;

    z-index:30;

    display:none;

    flex-direction:column;
    align-items:center;

    padding:25px;
}

.tituloSeccion{
    margin:0 0 18px;

    color:white;

    font-size:clamp(28px,4vw,50px);

    text-shadow:3px 3px 0 #000;
}

.grid{
    width:min(1100px,92vw);
    height:70vh;

    display:grid;

    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);

    gap:9px;
}

.nivel{
    background:rgba(0,0,0,.85);

    border:3px solid white;
    border-radius:3px;

    color:white;

    font-size:clamp(10px,1.4vw,18px);
    font-weight:bold;

    padding:8px;

    text-shadow:2px 2px 0 #000;

    box-shadow:
        4px 4px 0 #000,
        6px 6px 0 #444;
}

.nivel:hover,
.nivel:focus{
    outline:none;
    background:#ff4fa3;
}


/* =========================
   ENCUESTAS
========================= */

#encuestas{
    position:fixed;
    inset:0;

    z-index:30;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.textoEncuestas{
    color:white;

    font-size:clamp(30px,5vw,55px);

    text-shadow:4px 4px 0 #000;
}

.sinEncuestas{
    margin-top:12px;

    color:white;

    font-size:20px;

    text-shadow:2px 2px 0 #000;
}


/* =========================
   BOTÓN VOLVER
========================= */

.volver{
    margin-top:18px;

    min-width:150px;
    padding:12px 24px;

    background:rgba(0,0,0,.85);

    border:3px solid white;
    border-radius:4px;

    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:
        4px 4px 0 #000,
        6px 6px 0 #444;
}

.volver:hover,
.volver:focus{
    outline:none;
    background:#ff4fa3;
}


/* =========================
   MUERE
========================= */

#mensajeMuere{
    position:fixed;
    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:rgba(0,0,0,.93);

    color:white;

    text-align:center;

    font-size:clamp(25px,5vw,60px);
    font-weight:bold;

    text-shadow:4px 4px 0 #000;
}
</style>
</head>

<body>

<img id="fondo" alt="">


<!-- =========================
     PORTADA
========================= -->

<div id="portada">

    <h1 id="titulo">
        SOFI GAME
    </h1>

    <div id="subtitulo">
        ¿TE ATREVES A ENTRAR?
    </div>

    <div id="botonesPrincipales">

        <button
            class="botonPrincipal"
            id="juega">
            JUEGA
        </button>

        <button
            class="botonPrincipal"
            id="muereBoton">
            MUERE
        </button>

    </div>

</div>


<!-- =========================
     CASA
========================= -->

<div id="casa">

    <button
        class="botonEsquina"
        id="calavera">
        ☠
    </button>

    <button
        class="botonEsquina"
        id="pregunta">
        ?
    </button>

</div>


<!-- =========================
     NIVELES
========================= -->

<div id="niveles">

    <h1 class="tituloSeccion">
        NIVELES
    </h1>

    <div class="grid">

        <button class="nivel">1. Tras Tiendas 0</button>
        <button class="nivel">2. Caída a Vecindario</button>
        <button class="nivel">3. Escaleras Interminables</button>
        <button class="nivel">4. Hotel</button>

        <button class="nivel">5. Pasillos Susurrantes</button>
        <button class="nivel">6. Poolrooms</button>
        <button class="nivel">7. Backrooms Espejo</button>
        <button class="nivel">8. Paisaje</button>

        <button class="nivel">9. Hello Kitty</button>
        <button class="nivel">10. Hello Kitty Garden</button>
        <button class="nivel">11. Ojos 3.14</button>
        <button class="nivel">12. Simulación</button>

        <button class="nivel">13. Nivel Fun</button>
        <button class="nivel">14. Roba un Brainrot</button>
        <button class="nivel">15. Bosque</button>
        <button class="nivel">16. Pisos Flotantes</button>

    </div>

    <button
        class="volver"
        id="volverNiveles">
        ← VOLVER
    </button>

</div>


<!-- =========================
     ENCUESTAS
========================= -->

<div id="encuestas">

    <div class="textoEncuestas">
        ENCUESTAS
    </div>

    <div class="sinEncuestas">
        No hay encuestas disponibles.
    </div>

    <button
        class="volver"
        id="volverEncuestas">
        ← VOLVER
    </button>

</div>


<!-- =========================
     MUERE
========================= -->

<div id="mensajeMuere">

    TE VA A VIGILAR EMILIANO<br>
    DURANTE 2 HORAS

</div>


<script>

/* =========================
   IMÁGENES
========================= */

const amanecer =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000371081f59efdd1a9c32da2ab.png";

const dia =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000cd8881f5bc25446156aefaf4.jpg";

const noche =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000035c881f5b0866c6cc2b3f8b8.png";

const madrugada =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000021f881f5965a9605296becfd.png";


/* =========================
   HORARIO FINAL
========================= */

function cambiarTiempo(){

    const ahora = new Date();

    const minutos =
        ahora.getHours() * 60 +
        ahora.getMinutes();

    let imagen;

    if(minutos >= 330 && minutos < 420){

        /* 5:30 AM - 7:00 AM */
        imagen = amanecer;

    }else if(minutos >= 420 && minutos < 1140){

        /* 7:00 AM - 7:00 PM */
        imagen = dia;

    }else if(minutos >= 1140 || minutos < 30){

        /* 7:00 PM - 12:30 AM */
        imagen = noche;

    }else{

        /* 12:30 AM - 5:30 AM */
        imagen = madrugada;

    }

    document.getElementById("fondo").src = imagen;
}


/* =========================
   ELEMENTOS
========================= */

const portada =
document.getElementById("portada");

const casa =
document.getElementById("casa");

const niveles =
document.getElementById("niveles");

const encuestas =
document.getElementById("encuestas");

const calavera =
document.getElementById("calavera");

const pregunta =
document.getElementById("pregunta");


/* =========================
   JUEGA
========================= */

document.getElementById("juega").onclick = function(){

    portada.style.display = "none";

    casa.style.display = "block";

    calavera.style.display = "block";

    pregunta.style.display = "block";

};


/* =========================
   MUERE
========================= */

document.getElementById("muereBoton").onclick = function(){

    document.getElementById("mensajeMuere").style.display =
        "flex";

};


/* =========================
   CERRAR MUERE
========================= */

document.getElementById("mensajeMuere").onclick = function(){

    this.style.display = "none";

};


/* =========================
   CALAVERA → NIVELES
========================= */

calavera.onclick = function(){

    casa.style.display = "none";

    calavera.style.display = "none";

    pregunta.style.display = "none";

    niveles.style.display = "flex";

};


/* =========================
   ? → ENCUESTAS
========================= */

pregunta.onclick = function(){

    casa.style.display = "none";

    calavera.style.display = "none";

    pregunta.style.display = "none";

    encuestas.style.display = "flex";

};


/* =========================
   VOLVER DESDE NIVELES
========================= */

document.getElementById("volverNiveles").onclick = function(){

    niveles.style.display = "none";

    casa.style.display = "block";

    calavera.style.display = "block";

    pregunta.style.display = "block";

};


/* =========================
   VOLVER DESDE ENCUESTAS
========================= */

document.getElementById("volverEncuestas").onclick = function(){

    encuestas.style.display = "none";

    casa.style.display = "block";

    calavera.style.display = "block";

    pregunta.style.display = "block";

};


/* =========================
   INICIAR
========================= */

cambiarTiempo();

setInterval(cambiarTiempo,1000);

</script>

</body>
</html>
