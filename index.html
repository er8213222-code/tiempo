<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOFI GAME</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:"Courier New",monospace;
}

/* =========================
   FONDO
========================= */

#fondo{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

/* =========================
   PORTADA
========================= */

#portada{
    position:fixed;
    inset:0;
    z-index:5;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;
}

#titulo{
    margin:0;

    color:#ff4fa3;

    font-size:clamp(50px,8vw,100px);
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        4px 4px 0 #6d1743,
        0 0 12px rgba(255,79,163,.35);
}

#subtitulo{
    margin-top:8px;

    color:white;

    font-size:clamp(14px,2vw,25px);
    letter-spacing:3px;

    text-shadow:3px 3px 0 #000;
}


/* =========================
   JUEGA / MUERE
========================= */

#botones{
    display:flex;
    gap:20px;
    margin-top:35px;
}

.boton{
    min-width:160px;

    padding:14px 25px;

    background:rgba(0,0,0,.82);

    border:3px solid white;
    border-radius:4px;

    color:white;

    font-family:"Courier New",monospace;
    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:4px 4px 0 #000;
}

.boton:hover,
.boton:focus{
    outline:none;
    background:#ff4fa3;
}


/* =========================
   BOTONES CASA
========================= */

#calavera,
#pregunta{

    position:fixed;

    bottom:22px;

    width:62px;
    height:62px;

    z-index:20;

    background:rgba(0,0,0,.85);

    border:3px solid white;
    border-radius:4px;

    color:white;

    font-family:"Courier New",monospace;
    font-size:30px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:4px 4px 0 #000;

    display:none;
}

#calavera{
    left:22px;
}

#pregunta{
    right:22px;
}

#calavera:hover,
#pregunta:hover{
    background:#ff4fa3;
}


/* =========================
   PANTALLA CASA
========================= */

#casa{
    position:fixed;
    inset:0;

    z-index:4;

    display:none;
}


/* =========================
   NIVELES
========================= */

#niveles{
    position:fixed;
    inset:0;

    z-index:10;

    display:none;

    flex-direction:column;
    align-items:center;

    padding:25px;
}

#tituloNiveles{
    margin:0 0 18px;

    color:white;

    font-size:clamp(28px,4vw,50px);

    text-shadow:3px 3px 0 #000;
}

#grid{
    width:min(1100px,92vw);
    height:72vh;

    display:grid;

    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);

    gap:9px;
}

.nivel{
    background:rgba(0,0,0,.85);

    border:2px solid white;
    border-radius:3px;

    color:white;

    font-family:"Courier New",monospace;

    font-size:clamp(10px,1.4vw,18px);
    font-weight:bold;

    padding:8px;

    cursor:pointer;

    text-shadow:2px 2px 0 #000;
}

.nivel:hover,
.nivel:focus{
    outline:none;
    background:#ff4fa3;
}


/* =========================
   ENCUESTAS
========================= */

#encuestas{
    position:fixed;
    inset:0;

    z-index:10;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;
}

#tituloEncuestas{
    color:white;

    font-size:clamp(30px,5vw,55px);

    text-shadow:4px 4px 0 #000;
}

#sinEncuestas{
    margin-top:12px;

    color:white;

    font-size:20px;

    text-shadow:2px 2px 0 #000;
}


/* =========================
   MUERE
========================= */

#muere{
    position:fixed;
    inset:0;

    z-index:50;

    display:none;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:rgba(0,0,0,.92);

    color:white;

    text-align:center;

    font-size:clamp(25px,5vw,60px);
    font-weight:bold;

    text-shadow:4px 4px 0 #000;
}

</style>
</head>


<body>


<!-- =========================
     FONDO
========================= -->

<img id="fondo">


<!-- =========================
     PORTADA
========================= -->

<div id="portada">

    <h1 id="titulo">
        SOFI GAME
    </h1>

    <div id="subtitulo">
        ¿TE ATREVES A ENTRAR?
    </div>

    <div id="botones">

        <button
            class="boton"
            id="juega">
            JUEGA
        </button>

        <button
            class="boton"
            id="muereBoton">
            MUERE
        </button>

    </div>

</div>


<!-- =========================
     CASA
========================= -->

<div id="casa">

    <button id="calavera">
        ☠
    </button>

    <button id="pregunta">
        ?
    </button>

</div>


<!-- =========================
     NIVELES
========================= -->

<div id="niveles">

    <h1 id="tituloNiveles">
        NIVELES
    </h1>

    <div id="grid">

        <button class="nivel">1. Tras Tiendas 0</button>
        <button class="nivel">2. Caída a Vecindario</button>
        <button class="nivel">3. Escaleras Interminables</button>
        <button class="nivel">4. Hotel</button>

        <button class="nivel">5. Pasillos Susurrantes</button>
        <button class="nivel">6. Poolrooms</button>
        <button class="nivel">7. Backrooms Espejo</button>
        <button class="nivel">8. Paisaje</button>

        <button class="nivel">9. Hello Kitty</button>
        <button class="nivel">10. Hello Kitty Garden</button>
        <button class="nivel">11. Ojos 3.14</button>
        <button class="nivel">12. Simulación</button>

        <button class="nivel">13. Nivel Fun</button>
        <button class="nivel">14. Roba un Brainrot</button>
        <button class="nivel">15. Bosque</button>
        <button class="nivel">16. Pisos Flotantes</button>

    </div>

</div>


<!-- =========================
     ENCUESTAS
========================= -->

<div id="encuestas">

    <div id="tituloEncuestas">
        ENCUESTAS
    </div>

    <div id="sinEncuestas">
        No hay encuestas disponibles.
    </div>

</div>


<!-- =========================
     MUERE
========================= -->

<div id="muere">

    TE VA A VIGILAR EMILIANO<br>
    DURANTE 2 HORAS

</div>


<script>

/* =====================================================
   IMÁGENES
===================================================== */

const amanecer =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000371081f59efdd1a9c32da2ab.png";

const dia =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000cd8881f5bc25446156aefaf4.jpg";

const noche =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000035c881f5b0866c6cc2b3f8b8.png";

const madrugada =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000021f881f5965a9605296becfd.png";


/* =====================================================
   CAMBIO AUTOMÁTICO
===================================================== */

function cambiarTiempo(){

    const ahora = new Date();

    const minutos =
        ahora.getHours() * 60 +
        ahora.getMinutes();

    let imagen;

    if(minutos >= 330 && minutos < 420){

        imagen = amanecer;

    }

    else if(minutos >= 420 && minutos < 1200){

        imagen = dia;

    }

    else if(minutos >= 1200 || minutos < 30){

        imagen = noche;

    }

    else{

        imagen = madrugada;

    }

    document.getElementById("fondo").src = imagen;
}


/* =====================================================
   JUEGA
===================================================== */

document.getElementById("juega").onclick = function(){

    /* Ocultar portada */

    document.getElementById("portada").style.display =
        "none";

    /* Mostrar casa */

    document.getElementById("casa").style.display =
        "block";

    /* Mostrar botones SOLO ahora */

    document.getElementById("calavera").style.display =
        "block";

    document.getElementById("pregunta").style.display =
        "block";
};


/* =====================================================
   CALAVERA → NIVELES
===================================================== */

document.getElementById("calavera").onclick = function(){

    document.getElementById("casa").style.display =
        "none";

    document.getElementById("calavera").style.display =
        "none";

    document.getElementById("pregunta").style.display =
        "none";

    document.getElementById("niveles").style.display =
        "flex";
};


/* =====================================================
   ? → ENCUESTAS
===================================================== */

document.getElementById("pregunta").onclick = function(){

    document.getElementById("casa").style.display =
        "none";

    document.getElementById("calavera").style.display =
        "none";

    document.getElementById("pregunta").style.display =
        "none";

    document.getElementById("encuestas").style.display =
        "flex";
};


/* =====================================================
   MUERE
===================================================== */

document.getElementById("muereBoton").onclick = function(){

    document.getElementById("muere").style.display =
        "flex";
};


/* =====================================================
   CERRAR MENSAJE MUERE
===================================================== */

document.getElementById("muere").onclick = function(){

    document.getElementById("muere").style.display =
        "none";
};


/* =====================================================
   INICIAR
===================================================== */

cambiarTiempo();

setInterval(cambiarTiempo,60000);

</script>

</body>
</html>
