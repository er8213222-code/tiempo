<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOFI GAME</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", monospace;
}

/* =========================
   FONDO
========================= */

#fondo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

#oscuro {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 1;
}


/* =========================
   GENERAL
========================= */

.pantalla {
    position: fixed;
    inset: 0;
    z-index: 2;
}

.oculto {
    display: none !important;
}


/* =========================
   PORTADA
========================= */

#portada {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.logo {
    margin: 0;

    color: #ff4fa3;

    font-size: clamp(48px, 8vw, 105px);
    font-weight: 900;
    letter-spacing: 5px;

    text-shadow:
        4px 4px 0 #6d1743,
        0 0 12px rgba(255,79,163,0.35);
}

.subtitulo {
    margin-top: 8px;

    color: white;

    font-size: clamp(14px, 2vw, 25px);
    letter-spacing: 3px;

    text-shadow: 3px 3px 0 #000;
}


/* =========================
   BOTONES JUEGA / MUERE
========================= */

.botones-principales {
    display: flex;
    gap: 22px;
    margin-top: 38px;
}

.boton-principal {
    min-width: 160px;
    padding: 14px 25px;

    background: rgba(0,0,0,0.78);

    border: 3px solid white;
    border-radius: 4px;

    color: white;

    font-family: "Courier New", monospace;
    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 4px 4px 0 #000;
}

.boton-principal:focus,
.boton-principal:hover {
    outline: none;
    background: #ff4fa3;

    transform: translate(-2px,-2px);

    box-shadow: 6px 6px 0 #000;
}


/* =========================
   CALAVERA / ?
========================= */

.boton-esquina {
    position: fixed;

    bottom: 20px;

    width: 58px;
    height: 58px;

    background: rgba(0,0,0,0.80);

    border: 3px solid white;
    border-radius: 4px;

    color: white;

    font-family: "Courier New", monospace;
    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    z-index: 5;

    box-shadow: 4px 4px 0 #000;
}

.boton-esquina:focus,
.boton-esquina:hover {
    outline: none;
    background: #ff4fa3;

    transform: translateY(-2px);
}

#calavera {
    left: 20px;
}

#pregunta {
    right: 20px;
}


/* =========================
   PANTALLA CASA
========================= */

#casa {
    display: none;
}


/*
   Al jugar NO aparece ningún título,
   botón de volver ni niveles.
   Solamente queda el fondo.
*/


/* =========================
   NIVELES
========================= */

#niveles {
    display: none;

    flex-direction: column;
    align-items: center;

    padding: 25px 30px;
}

.titulo {
    margin: 0 0 18px;

    color: white;

    font-size: clamp(26px, 4vw, 48px);

    text-shadow: 3px 3px 0 #000;
}

.grid {
    width: min(1100px, 92vw);

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    grid-template-rows: repeat(4, 1fr);

    gap: 9px;

    height: 70vh;
}

.nivel {
    background: rgba(0,0,0,0.82);

    border: 2px solid white;
    border-radius: 3px;

    color: white;

    font-family: "Courier New", monospace;

    font-size: clamp(11px, 1.4vw, 18px);
    font-weight: bold;

    padding: 8px;

    cursor: pointer;

    text-shadow: 2px 2px 0 #000;

    box-shadow: 3px 3px 0 #000;
}

.nivel:focus,
.nivel:hover {
    outline: none;

    background: #ff4fa3;

    transform: translate(-2px,-2px);
}


/* =========================
   ENCUESTAS
========================= */

#encuestas {
    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;
}

.encuestas-titulo {
    color: white;

    font-size: clamp(30px, 5vw, 55px);

    text-shadow: 4px 4px 0 #000;
}

.encuestas-vacio {
    margin-top: 10px;

    color: white;

    font-size: clamp(15px, 2vw, 22px);

    text-shadow: 2px 2px 0 #000;
}


/* =========================
   MENSAJE MUERE
========================= */

#mensajeMuere {
    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 30px;

    background: rgba(0,0,0,0.90);

    color: white;

    text-align: center;

    font-size: clamp(25px, 5vw, 60px);
    font-weight: bold;

    text-shadow:
        4px 4px 0 #000;
}

</style>
</head>

<body>

<!-- =========================
     FONDO
========================= -->

<img id="fondo" alt="SOFI GAME">

<div id="oscuro"></div>


<!-- =========================
     PORTADA
========================= -->

<section id="portada" class="pantalla">

    <h1 class="logo">
        SOFI GAME
    </h1>

    <div class="subtitulo">
        ¿TE ATREVES A ENTRAR?
    </div>

    <div class="botones-principales">

        <button
            id="btnJuega"
            class="boton-principal">
            JUEGA
        </button>

        <button
            id="btnMuere"
            class="boton-principal">
            MUERE
        </button>

    </div>


    <!-- CALAVERA -->

    <button
        id="calavera"
        class="boton-esquina"
        aria-label="Niveles">
        ☠
    </button>


    <!-- SIGNO DE PREGUNTA -->

    <button
        id="pregunta"
        class="boton-esquina"
        aria-label="Encuestas">
        ?
    </button>

</section>


<!-- =========================
     CASA
========================= -->

<section id="casa" class="pantalla oculto">
</section>


<!-- =========================
     NIVELES
========================= -->

<section id="niveles" class="pantalla oculto">

    <h2 class="titulo">
        NIVELES
    </h2>

    <div class="grid">

        <button class="nivel">1. Tras Tiendas 0</button>
        <button class="nivel">2. Caída a Vecindario</button>
        <button class="nivel">3. Escaleras Interminables</button>
        <button class="nivel">4. Hotel</button>

        <button class="nivel">5. Pasillos Susurrantes</button>
        <button class="nivel">6. Poolrooms</button>
        <button class="nivel">7. Backrooms Espejo</button>
        <button class="nivel">8. Paisaje</button>

        <button class="nivel">9. Hello Kitty</button>
        <button class="nivel">10. Hello Kitty Garden</button>
        <button class="nivel">11. Ojos 3.14</button>
        <button class="nivel">12. Simulación</button>

        <button class="nivel">13. Nivel Fun</button>
        <button class="nivel">14. Roba un Brainrot</button>
        <button class="nivel">15. Bosque</button>
        <button class="nivel">16. Pisos Flotantes</button>

    </div>

</section>


<!-- =========================
     ENCUESTAS
========================= -->

<section id="encuestas" class="pantalla oculto">

    <div class="encuestas-titulo">
        ENCUESTAS
    </div>

    <div class="encuestas-vacio">
        No hay encuestas disponibles.
    </div>

</section>


<!-- =========================
     MENSAJE MUERE
========================= -->

<div id="mensajeMuere">

    TE VA A VIGILAR EMILIANO<br>
    DURANTE 2 HORAS

</div>


<script>

/* =====================================================
   IMÁGENES
===================================================== */

const amanecer =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000371081f59efdd1a9c32da2ab.png";

const dia =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_00000000cd8881f5bc25446156aefaf4.jpg";

const noche =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000035c881f5b0866c6cc2b3f8b8.png";

const madrugada =
"https://raw.githubusercontent.com/er8213222-code/tiempo/main/file_0000000021f881f5965a9605296becfd.png";


/* =====================================================
   CAMBIO DE FONDO SEGÚN LA HORA
===================================================== */

function cambiarTiempo() {

    const ahora = new Date();

    const minutos =
        ahora.getHours() * 60 +
        ahora.getMinutes();

    let imagen;

    // 5:30 AM - 7:00 AM
    if (minutos >= 330 && minutos < 420) {

        imagen = amanecer;

    }

    // 7:00 AM - 8:00 PM
    else if (minutos >= 420 && minutos < 1200) {

        imagen = dia;

    }

    // 8:00 PM - 12:30 AM
    else if (minutos >= 1200 || minutos < 30) {

        imagen = noche;

    }

    // 12:30 AM - 5:30 AM
    else {

        imagen = madrugada;

    }

    document.getElementById("fondo").src = imagen;
}


/* =====================================================
   PANTALLAS
===================================================== */

const portada =
document.getElementById("portada");

const casa =
document.getElementById("casa");

const niveles =
document.getElementById("niveles");

const encuestas =
document.getElementById("encuestas");


function mostrarSolo(pantalla) {

    portada.classList.add("oculto");
    casa.classList.add("oculto");
    niveles.classList.add("oculto");
    encuestas.classList.add("oculto");

    pantalla.classList.remove("oculto");
}


/* =====================================================
   JUEGA
===================================================== */

document.getElementById("btnJuega")
.addEventListener("click", function() {

    /*
       La casa no tiene botones,
       títulos ni niveles.
    */

    mostrarSolo(casa);

});


/* =====================================================
   MUERE
===================================================== */

document.getElementById("btnMuere")
.addEventListener("click", function() {

    document.getElementById("mensajeMuere").style.display =
        "flex";

});


/* =====================================================
   CERRAR MENSAJE MUERE
   Tocando/clic en cualquier parte
===================================================== */

document.getElementById("mensajeMuere")
.addEventListener("click", function() {

    this.style.display = "none";

});


/* =====================================================
   CALAVERA → NIVELES
===================================================== */

document.getElementById("calavera")
.addEventListener("click", function() {

    mostrarSolo(niveles);

});


/* =====================================================
   ? → ENCUESTAS
===================================================== */

document.getElementById("pregunta")
.addEventListener("click", function() {

    mostrarSolo(encuestas);

});


/* =====================================================
   INICIAR
===================================================== */

cambiarTiempo();

setInterval(cambiarTiempo, 60000);

</script>

</body>
</html>
